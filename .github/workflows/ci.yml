# CI gates (ARCHITECTURE Invariants 2 and 8):
#   - the cross-tenant RLS test runs UNCONDITIONALLY; deleting or skipping it
#     fails this workflow by absence (the step would error on a missing file)
#   - the axe accessibility suite fails the build on any violation
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres 18 to match local + production (ASSUMPTIONS #83)
        image: postgres:18-alpine
        env:
          POSTGRES_DB: curbside
          POSTGRES_USER: curbside_owner
          POSTGRES_PASSWORD: curbside_owner_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curbside_owner -d curbside"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://curbside_app:curbside_app_dev@localhost:5432/curbside
      DATABASE_URL_OWNER: postgres://curbside_owner:curbside_owner_dev@localhost:5432/curbside
      DATABASE_URL_CONTROL: postgres://curbside_control:curbside_control_dev@localhost:5432/curbside
      PLATFORM_APEX: localhost
      STAFF_STATUS_TOKEN: ci-status-token
      ALLOW_ENV_SECRETS: "1"
      UPLOAD_DIR: .data/uploads
      # Intake now auto-sources images (D11) — CI must not hammer Openverse.
      # The skip still records the honest pending_actions queue item.
      SKIP_IMAGE_SOURCING: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed

      # The control-plane e2e suite (12.4 / 12.5) asserts against the fleet
      # fixtures (bayside-detailing, sunrise-pool-care) — this seed was never
      # run in CI, which is why every run in repo history failed (D24).
      # DB-only, idempotent, no network or secrets. Banned from PRODUCTION
      # (ASSUMPTIONS #80), not from CI.
      - run: npm run db:seed:fleet

      - name: Guard — the RLS isolation test must exist (Invariant 2)
        run: test -f tests/rls-isolation.test.ts

      - run: npm run build

      - name: Cross-tenant isolation (D4) — the highest-severity gate
        run: npm run test:rls

      - name: Growth plane — scheduler/quota/NAP-invariant gates (Session 3)
        run: npm run test:growth

      - name: Origin/edge trust boundary (D23)
        run: npm run test:boundary

      - name: Domain instructions + primary-domain invariants (D22)
        run: npm run test:domains

      - name: Nothing automated ever suspends (D7 / ASSUMPTIONS #44)
        run: npm run test:suspend-gate

      - name: Footer credit targets return 200 in production (Invariant 11)
        run: npm run test:credits

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # After the browser install so the sample-report PDF renders; the axe
      # suite audits the generated report artifact (GROWTH Part 5 + D12).
      - run: npm run db:seed:growth

      - name: Smoke + lifecycle + axe accessibility gate (D12)
        run: npm run test:e2e
